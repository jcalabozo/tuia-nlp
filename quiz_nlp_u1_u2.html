<style>
  :root {
    --paper: #f5f0e6;
    --paper-deep: #ece4d3;
    --card: #fffcf4;
    --ink: #1a1612;
    --ink-soft: #5a4d3e;
    --rule: #c8b99a;
    --accent: #8b1a1a;
    --accent-tint: rgba(139, 26, 26, 0.06);
    --correct: #3d5a2c;
    --correct-tint: rgba(61, 90, 44, 0.09);
    --wrong: #9b2020;
    --wrong-tint: rgba(139, 26, 26, 0.07);
    --partial: #9a5f12;
    --partial-tint: rgba(184, 115, 31, 0.11);
    --on-strong: #ffffff;
    --shadow: rgba(26, 22, 18, 0.08);

    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171411; --paper-deep: #221e19; --card: #1e1a16; --ink: #ede5d6; --ink-soft: #b3a58d;
      --rule: #4a4034; --accent: #e07a6f; --accent-tint: rgba(224, 122, 111, 0.1);
      --correct: #9cc47f; --correct-tint: rgba(156, 196, 127, 0.11); --wrong: #ee8579; --wrong-tint: rgba(238, 133, 121, 0.1);
      --partial: #e0a95c; --partial-tint: rgba(224, 169, 92, 0.12); --on-strong: #171411; --shadow: rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171411; --paper-deep: #221e19; --card: #1e1a16; --ink: #ede5d6; --ink-soft: #b3a58d;
    --rule: #4a4034; --accent: #e07a6f; --accent-tint: rgba(224, 122, 111, 0.1);
    --correct: #9cc47f; --correct-tint: rgba(156, 196, 127, 0.11); --wrong: #ee8579; --wrong-tint: rgba(238, 133, 121, 0.1);
    --partial: #e0a95c; --partial-tint: rgba(224, 169, 92, 0.12); --on-strong: #171411; --shadow: rgba(0, 0, 0, 0.35);

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* HEADER */

  .header-meta { display: flex; flex-wrap: wrap; gap: 0.5rem 2rem; margin-top: 1rem; font-family: var(--mono); font-size: 0.78rem; color: var(--ink-soft); }

  .theme-toggle { position: absolute; top: 0; right: 0; width: 2.2rem; height: 2.2rem; border: 1px solid var(--rule); border-radius: 50%; background: transparent; cursor: pointer; font-size: 1rem; line-height: 1; }

  /* BANNER */

  /* START */

  .chip[aria-pressed="true"] strong { color: var(--accent); }
  #cat-chips .chip[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
  .setup-row { display: flex; flex-wrap: wrap; gap: 0.8rem 1.6rem; align-items: center; margin-top: 1.1rem; font-size: 0.92rem; }
  .field select { margin-left: 0.4rem; padding: 0.3rem 0.5rem; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); }
  .check { display: inline-flex; gap: 0.45rem; align-items: center; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 1rem; height: 1rem; }
  .types-line { margin-top: 1rem; font-family: var(--mono); font-size: 0.72rem; color: var(--ink-soft); }
  .start-actions { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; margin: 1.5rem 0 2rem; }
  .selection-summary { font-family: var(--mono); font-size: 0.78rem; color: var(--ink-soft); }
  .resume { border-left: 3px solid var(--accent); }
  .resume p { margin-bottom: 0.8rem; }
  .history-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .history-table td, .history-table th { padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--rule); text-align: left; }
  .history-table th { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 400; }
  .history-table td.num { font-family: var(--mono); text-align: right; }
  .kbd-help { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-soft); line-height: 2; }
  kbd { font-family: var(--mono); font-size: 0.7rem; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0.05rem 0.35rem; background: var(--card); }

  /* PROGRESS */
  .progress-wrap { margin-bottom: 1.5rem; font-family: var(--mono); }
  .progress-label { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.5rem; }
  .progress-label > span:first-child { white-space: nowrap; }
  .progress-label .right { display: flex; gap: 1rem; align-items: baseline; min-width: 0; }
  #q-category { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress-bar { height: 4px; background: var(--paper-deep); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

  /* QUESTION CARD */
  .question-card { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 2rem 2rem 1.5rem; box-shadow: 0 4px 16px var(--shadow); margin-bottom: 1.5rem; position: relative; }
  .question-card::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 3px; background: var(--accent); }
  .question-card.shake { animation: shake 0.3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .question-meta { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }

  .hint strong { color: var(--accent); }
  .snippet { font-family: var(--mono); font-size: 0.82rem; line-height: 1.5; background: var(--paper); border-left: 2px solid var(--ink-soft); padding: 1rem 1.2rem; margin: -0.3rem 0 1.2rem; overflow-x: auto; white-space: pre; }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .option { display: flex; align-items: flex-start; gap: 0.85rem; width: 100%; text-align: left; padding: 0.85rem 1rem; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; font-family: var(--serif); font-size: 1.05rem; line-height: 1.4; }
  .option:hover:not(:disabled) { border-color: var(--ink); background: var(--card); }
  .option:disabled { cursor: default; }
  .option.selected { border-color: var(--accent); background: var(--accent-tint); }
  .option.correct { border-color: var(--correct); background: var(--correct-tint); }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-tint); }
  .option.missed { border-color: var(--correct); border-style: dashed; }
  .option-marker { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1.5px solid var(--ink-soft); flex-shrink: 0; margin-top: 0.12rem; font-family: var(--mono); font-size: 0.72rem; color: var(--ink-soft); }
  .marker-radio { border-radius: 50%; }
  .marker-check { border-radius: 3px; }
  .option.selected .option-marker { background: var(--accent); border-color: var(--accent); color: var(--on-strong); }
  .option.correct .option-marker { background: var(--correct); border-color: var(--correct); color: var(--on-strong); }
  .option.wrong .option-marker { background: var(--wrong); border-color: var(--wrong); color: var(--on-strong); }
  .option.missed .option-marker { border-color: var(--correct); color: var(--correct); }
  .option-text { flex: 1; }

  /* TEXT */
  .text-input, .text-area { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); font-size: 1rem; }
  .text-input { font-family: var(--mono); }
  .text-area { font-family: var(--serif); font-size: 1.05rem; line-height: 1.5; resize: vertical; min-height: 7rem; }
  .text-input:focus, .text-area:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .text-input.correct { border-color: var(--correct); background: var(--correct-tint); }
  .text-input.wrong { border-color: var(--wrong); background: var(--wrong-tint); }

  /* MATCH */
  .match { display: flex; flex-direction: column; gap: 0.6rem; }
  .match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 0.6rem 1rem; align-items: center; padding: 0.7rem 0.9rem; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); }
  .match-left { font-family: var(--serif); font-size: 1.05rem; font-weight: 500; }
  .match-select { width: 100%; padding: 0.45rem 0.5rem; border: 1px solid var(--rule); border-radius: 3px; background: var(--card); font-size: 0.92rem; }
  .match-row.correct { border-color: var(--correct); background: var(--correct-tint); }
  .match-row.wrong { border-color: var(--wrong); background: var(--wrong-tint); }
  .match-fb { grid-column: 1 / -1; font-size: 0.85rem; color: var(--correct); }
  .match-fb:empty { display: none; }

  /* ORDER */
  .order { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .order-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0.8rem; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); font-family: var(--serif); font-size: 1.05rem; }

  .order-item.correct { border-color: var(--correct); background: var(--correct-tint); }

  .feedback { margin-top: 1.2rem; padding: 1rem 1.2rem; border-radius: 3px; font-family: var(--serif); font-size: 1.05rem; line-height: 1.5; border-left: 3px solid var(--rule); background: var(--paper); }

  .feedback.wrong .feedback-label { color: var(--wrong); }

  .fb-extra { margin-bottom: 0.6rem; }

  .fb-explain { padding-top: 0.6rem; border-top: 1px solid var(--rule); margin-top: 0.4rem; }
  .fb-extra:only-child, .fb-explain:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .grade-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 1rem; padding-top: 0.9rem; border-top: 1px solid var(--rule); }

  .btn-grade { border: 1.5px solid var(--rule); background: var(--card); padding: 0.5rem 0.9rem; border-radius: 3px; cursor: pointer; font-family: var(--mono); font-size: 0.8rem; }
  .btn-grade[data-g="correct"]:hover { border-color: var(--correct); color: var(--correct); }
  .btn-grade[data-g="partial"]:hover { border-color: var(--partial); color: var(--partial); }
  .btn-grade[data-g="wrong"]:hover { border-color: var(--wrong); color: var(--wrong); }

  /* CONTROLS */
  .controls { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .btn { font-family: var(--mono); font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.85rem 1.6rem; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; transition: all 0.15s ease; border-radius: 2px; }
  .btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--on-strong); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--ink); }
  .btn-secondary:hover:not(:disabled) { background: var(--paper-deep); color: var(--ink); border-color: var(--ink); }
  .btn-small { padding: 0.55rem 1rem; font-size: 0.75rem; }

  /* RESULTS */
  .results { text-align: center; padding: 2rem 0 1rem; }

  .results-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.8rem; max-width: 560px; margin: 0 auto 2rem; }
  .stat { padding: 1rem 0.6rem; border: 1px solid var(--rule); border-radius: 3px; background: var(--card); }
  .stat-num { font-family: var(--serif); font-size: 2rem; font-weight: 600; line-height: 1; margin-bottom: 0.3rem; }
  .stat-label { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  .stat.good .stat-num { color: var(--correct); }
  .stat.bad .stat-num { color: var(--wrong); }

  .section-title { font-family: var(--serif); font-size: 1.15rem; margin-bottom: 1rem; color: var(--ink-soft); font-style: italic; }
  .cat-results { max-width: 560px; margin: 0 auto 2rem; text-align: left; }
  .cat-row { padding: 0.65rem 1rem; margin-bottom: 0.45rem; background: var(--card); border: 1px solid var(--rule); border-radius: 3px; }
  .cat-row-top { display: flex; justify-content: space-between; gap: 1rem; font-family: var(--serif); }
  .cat-row-score { font-family: var(--mono); font-size: 0.82rem; color: var(--ink-soft); white-space: nowrap; }
  .cat-row-score strong { color: var(--ink); }
  .cat-bar { height: 3px; background: var(--paper-deep); border-radius: 2px; margin-top: 0.45rem; overflow: hidden; }
  .cat-bar div { height: 100%; }
  .results-actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
  .ornament { text-align: center; color: var(--rule); font-size: 1.5rem; margin: 1.5rem 0; letter-spacing: 1rem; }

  /* REVIEW */
  .review-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem; margin: 3rem 0 1.5rem; }
  .review-head h2 { font-family: var(--serif); font-size: 1.8rem; }
  .review-filter { display: flex; gap: 0.4rem; }
  .review-item { margin-bottom: 1.2rem; padding: 1.2rem 1.25rem; background: var(--card); border: 1px solid var(--rule); border-left-width: 3px; border-radius: 3px; }
  .review-item.correct { border-left-color: var(--correct); }
  .review-item.wrong, .review-item.skipped { border-left-color: var(--wrong); }
  .review-item.partial { border-left-color: var(--partial); }
  .review-meta { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--ink-soft); }
  .review-meta .st-correct { color: var(--correct); }
  .review-meta .st-wrong, .review-meta .st-skipped { color: var(--wrong); }
  .review-meta .st-partial { color: var(--partial); }
  .review-q { font-family: var(--serif); font-size: 1.1rem; margin-bottom: 0.6rem; }
  .review-line { font-size: 0.92rem; margin-bottom: 0.3rem; }
  .review-line > em { color: var(--ink-soft); }
  .review-block { margin: 0.25rem 0 0.2rem 1rem; }
  .review-explain { font-size: 0.92rem; padding-top: 0.5rem; margin-top: 0.5rem; border-top: 1px solid var(--rule); color: var(--ink-soft); }

  @media (max-width: 640px) {
    .container { padding: 2rem 1rem 3rem; }
    .question-card { padding: 1.5rem 1.1rem 1.2rem; }
    .question-text { font-size: 1.15rem; }
    .snippet { font-size: 0.72rem; }
    .match-row { grid-template-columns: 1fr; }
    .controls .btn { padding: 0.8rem 1.1rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="header-eyebrow" id="h-eyebrow"></div>
    <h1 id="h-title"></h1>
    <div class="header-meta" id="h-meta"></div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema"></button>
  </header>

  <div id="errors-banner" class="banner hidden" role="alert"></div>

  <!-- INICIO -->
  <main id="start-screen">
    <p class="start-info" id="start-desc"></p>

    <section class="panel resume hidden" id="resume-panel">
      <div class="panel-title">Intento sin terminar</div>
      <p id="resume-text"></p>
      <div class="start-actions" style="margin: 0;">
        <button class="btn btn-small" id="btn-resume" type="button">Continuar →</button>
        <button class="btn btn-secondary btn-small" id="btn-discard" type="button">Descartar</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <span>Temas</span>
        <span class="links"><button class="link" id="cats-all" type="button">todos</button> · <button class="link" id="cats-none" type="button">ninguno</button></span>
      </div>
      <div class="chips" id="cat-chips"></div>
      <div class="setup-row">
        <label class="field">Cantidad<select id="opt-count"></select></label>
        <label class="check"><input type="checkbox" id="opt-shuffle"> Mezclar orden de preguntas</label>
        <label class="check" id="opt-open-wrap"><input type="checkbox" id="opt-open"> Incluir preguntas de desarrollo</label>
      </div>
      <div class="types-line" id="types-line"></div>
    </section>

    <div class="start-actions">
      <button class="btn" id="btn-start" type="button">Empezar →</button>
      <button class="btn btn-secondary hidden" id="btn-review-failed" type="button"></button>
      <span class="selection-summary" id="selection-summary"></span>
    </div>

    <section class="panel hidden" id="history-panel">
      <div class="panel-title"><span>Intentos anteriores</span><span class="links"><button class="link" id="btn-clear-history" type="button">borrar historial</button></span></div>
      <table class="history-table" id="history-table"></table>
    </section>

    <p class="kbd-help">
      Atajos: <kbd>1</kbd>–<kbd>9</kbd> elegir opción · <kbd>Enter</kbd> verificar / siguiente · <kbd>S</kbd> saltar · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> desde un texto de desarrollo
    </p>
  </main>

  <!-- QUIZ -->
  <main id="quiz-screen" class="hidden">
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Pregunta <span id="q-current">1</span> / <span id="q-total">1</span></span>
        <span class="right"><span id="q-category"></span><button class="link" id="btn-finish" type="button">terminar</button></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>
    </div>

    <article class="question-card" id="q-card"></article>

    <div class="controls">
      <button class="btn btn-secondary" id="btn-skip" type="button">Saltar</button>
      <button class="btn" id="btn-action" type="button">Verificar</button>
    </div>
  </main>

  <!-- RESULTADOS -->
  <main id="results-screen" class="hidden">
    <div class="results">
      <div class="results-eyebrow" id="results-eyebrow">Resultado final</div>
      <div class="results-score" id="results-score">0%</div>
      <div class="results-fraction" id="results-fraction"></div>
      <p class="results-message" id="results-message"></p>
      <div class="results-stats" id="results-stats"></div>
      <div class="ornament">· · ·</div>
      <h3 class="section-title">Desempeño por tema</h3>
      <div class="cat-results" id="cat-results"></div>
      <div class="results-actions">
        <button class="btn" id="btn-review" type="button">Revisar respuestas</button>
        <button class="btn btn-secondary hidden" id="btn-retry-failed" type="button"></button>
        <button class="btn btn-secondary" id="btn-home" type="button">Volver al inicio</button>
      </div>
    </div>

    <section id="review-section" class="hidden">
      <div class="review-head">
        <h2>Revisión</h2>
        <div class="review-filter">
          <button class="chip" type="button" data-filter="all" aria-pressed="true">Todas</button>
          <button class="chip" type="button" data-filter="failed" aria-pressed="false">Solo falladas</button>
        </div>
      </div>
      <div id="review-list"></div>
    </section>
  </main>

</div>

<script>
/* ═══════════════════════ MOTOR · no hace falta editar ═══════════════════════ */
(function () {
  'use strict';

  // ───────── utilidades ─────────
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parser = new DOMParser();
  const plain = (html) => (parser.parseFromString(String(html ?? ''), 'text/html').body.textContent || '').trim();
  const range = (n) => Array.from({ length: n }, (_, i) => i);
  const isStr = (x) => typeof x === 'string' && x.trim() !== '';
  const isIdx = (x, n) => Number.isInteger(x) && x >= 0 && x < n;
  const fmtNum = (x) => (Number.isInteger(x) ? String(x) : x.toFixed(1).replace('.', ','));

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function hash(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
    },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* sin almacenamiento */ } },
    del(key) { try { localStorage.removeItem(key); } catch (e) { /* sin almacenamiento */ } }
  };
  const quizId = isStr(QUIZ.id) ? QUIZ.id : 'quiz';
  const K = (name) => `quiz:${quizId}:${name}`;

  // ───────── validación y banco ─────────
  const TYPES = {
    single: 'Opción única', multi: 'Opción múltiple', tf: 'Verdadero o falso', text: 'Respuesta corta',
    match: 'Emparejar', order: 'Ordenar', open: 'Desarrollo'
  };
  const TYPE_PLURAL = {
    single: 'opción única', multi: 'opción múltiple', tf: 'V/F', text: 'respuesta corta',
    match: 'emparejar', order: 'ordenar', open: 'desarrollo'
  };

  function validate(q) {
    if (!q || typeof q !== 'object') return ['no es un objeto'];
    const e = [];
    if (!isStr(q.cat)) e.push('falta "cat"');
    if (!TYPES[q.type]) e.push(`"type" inválido (${q.type})`);
    if (!isStr(q.text)) e.push('falta "text"');
    const optsOk = Array.isArray(q.options) && q.options.length >= 2 && q.options.every(isStr);
    switch (q.type) {
      case 'single':
        if (!optsOk) e.push('"options" necesita al menos 2 textos');
        else if (!isIdx(q.answer, q.options.length)) e.push('"answer" debe ser un índice válido de "options"');
        break;
      case 'multi':
        if (!optsOk) e.push('"options" necesita al menos 2 textos');
        else if (!Array.isArray(q.answer) || !q.answer.length || !q.answer.every((i) => isIdx(i, q.options.length)) || new Set(q.answer).size !== q.answer.length)
          e.push('"answer" debe ser una lista de índices válidos, sin repetir');
        break;
      case 'tf':
        if (typeof q.answer !== 'boolean') e.push('"answer" debe ser true o false');
        break;
      case 'text':
        if (!Array.isArray(q.answers) || !q.answers.length || !q.answers.every(isStr)) e.push('"answers" debe ser una lista de respuestas aceptadas');
        break;
      case 'match':
        if (!Array.isArray(q.pairs) || q.pairs.length < 2 || !q.pairs.every((p) => Array.isArray(p) && p.length === 2 && isStr(p[0]) && isStr(p[1])))
          e.push('"pairs" debe ser una lista de al menos 2 pares [izquierda, derecha]');
        else if (q.extra && (!Array.isArray(q.extra) || !q.extra.every(isStr))) e.push('"extra" debe ser una lista de textos');
        else {
          const rights = q.pairs.map((p) => plain(p[1])).concat((q.extra || []).map(plain));
          if (new Set(rights).size !== rights.length) e.push('las opciones de la derecha (incluidas las de "extra") no pueden repetirse');
        }
        break;
      case 'order':
        if (!Array.isArray(q.items) || q.items.length < 2 || !q.items.every(isStr)) e.push('"items" debe ser una lista de al menos 2 elementos, en el orden correcto');
        break;
      case 'open':
        if (!isStr(q.answer)) e.push('"answer" debe contener la respuesta modelo');
        if (q.points && (!Array.isArray(q.points) || !q.points.every(isStr))) e.push('"points" debe ser una lista de textos');
        break;
    }
    return e;
  }

  const BANK = [];
  const ERRORS = [];
  const usedIds = new Set();
  (Array.isArray(QUESTIONS) ? QUESTIONS : []).forEach((q, n) => {
    const errs = validate(q);
    if (errs.length) {
      ERRORS.push({ n: n + 1, text: plain(q && q.text).slice(0, 80), errs });
      return;
    }
    let id = isStr(q.id) ? q.id : hash(q.type + '|' + plain(q.text));
    while (usedIds.has(id)) id += '_';
    usedIds.add(id);
    BANK.push(Object.assign({}, q, { id, n }));
  });
  const BY_ID = new Map(BANK.map((q) => [q.id, q]));
  const CATS = [...new Set(BANK.map((q) => q.cat))];
  const HAS_OPEN = BANK.some((q) => q.type === 'open');
  if (ERRORS.length) console.warn('Preguntas omitidas por errores de formato:', ERRORS);

  // ───────── estado ─────────
  let S = null;          // sesión en curso
  let LAST = null;       // último resultado mostrado
  let reviewFilter = 'all';
  const card = $('#q-card');

  const defaults = { cats: CATS.slice(), count: 'all', shuffle: true, open: true };
  const settings = Object.assign({}, defaults, store.get(K('settings'), {}));
  settings.cats = (settings.cats || []).filter((c) => CATS.includes(c));
  if (!settings.cats.length) settings.cats = CATS.slice();
  const saveSettings = () => store.set(K('settings'), settings);

  const saveSession = () => { if (S) store.set(K('session'), S); };
  const clearSession = () => store.del(K('session'));
  const curQ = () => BY_ID.get(S.ids[S.cur]);

  function loadSession() {
    const s = store.get(K('session'), null);
    if (!s || !Array.isArray(s.ids) || !s.ids.length || !s.ids.every((id) => BY_ID.has(id)) || !isIdx(s.cur, s.ids.length)) {
      if (s) clearSession();
      return null;
    }
    return s;
  }

  function recordStats(q, r) {
    const st = store.get(K('qstats'), {});
    const cur = st[q.id] || { seen: 0, ok: 0 };
    cur.seen += 1;
    if (r.status === 'correct') cur.ok += 1;
    cur.last = r.status;
    st[q.id] = cur;
    store.set(K('qstats'), st);
  }

  function failedFromHistory() {
    const st = store.get(K('qstats'), {});
    return BANK.filter((q) => st[q.id] && st[q.id].last !== 'correct').map((q) => q.id);
  }

  // ───────── tema claro / oscuro ─────────
  const root = document.documentElement;
  const savedTheme = store.get('quiz:theme', null);
  if (savedTheme === 'light' || savedTheme === 'dark') root.dataset.theme = savedTheme;
  const effectiveTheme = () => root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const paintToggle = () => { $('#theme-toggle').textContent = effectiveTheme() === 'dark' ? '☀' : '☾'; };
  $('#theme-toggle').addEventListener('click', () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    store.set('quiz:theme', next);
    paintToggle();
  });
  paintToggle();

  // ───────── pantallas ─────────
  let screen = 'start';
  function show(name) {
    screen = name;
    $('#start-screen').classList.toggle('hidden', name !== 'start');
    $('#quiz-screen').classList.toggle('hidden', name !== 'quiz');
    $('#results-screen').classList.toggle('hidden', name !== 'results');
    window.scrollTo({ top: 0 });
  }

  // ───────── encabezado ─────────
  document.title = plain(QUIZ.titulo || 'Quiz') + (QUIZ.subtitulo ? ' — ' + plain(QUIZ.subtitulo) : '');
  $('#h-eyebrow').innerHTML = QUIZ.eyebrow || '';
  $('#h-title').innerHTML = QUIZ.titulo || 'Quiz';
  $('#h-meta').innerHTML =
    `<span><strong>${BANK.length}</strong> preguntas</span>` +
    (QUIZ.subtitulo ? `<span>${QUIZ.subtitulo}</span>` : '') +
    `<span><strong>${CATS.length}</strong> ${CATS.length === 1 ? 'tema' : 'temas'}</span>`;

  if (ERRORS.length) {
    const b = $('#errors-banner');
    b.innerHTML = `<strong>${ERRORS.length} ${ERRORS.length === 1 ? 'pregunta tiene' : 'preguntas tienen'} errores de formato y se omitieron:</strong><ul>` +
      ERRORS.map((x) => `<li>#${x.n} «${esc(x.text)}…»: ${esc(x.errs.join('; '))}</li>`).join('') + '</ul>';
    b.classList.remove('hidden');
  }

  // ───────── pantalla de inicio ─────────
  function pool() {
    return BANK.filter((q) => settings.cats.includes(q.cat) && (settings.open || q.type !== 'open'));
  }

  function renderStart() {
    $('#start-desc').innerHTML = QUIZ.descripcion || '';

    $('#cat-chips').innerHTML = CATS.map((c) => {
      const n = BANK.filter((q) => q.cat === c && (settings.open || q.type !== 'open')).length;
      return `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${settings.cats.includes(c)}">${esc(c)}<strong>${n}</strong></button>`;
    }).join('');

    $('#opt-shuffle').checked = !!settings.shuffle;
    $('#opt-open').checked = !!settings.open;
    $('#opt-open-wrap').classList.toggle('hidden', !HAS_OPEN);

    const avail = pool().length;
    const sizes = [10, 15, 20, 30, 40, 50, 75, 100].filter((n) => n < avail);
    if (settings.count !== 'all' && !sizes.includes(settings.count)) settings.count = 'all';
    $('#opt-count').innerHTML = sizes.map((n) => `<option value="${n}">${n}</option>`).join('') +
      `<option value="all">Todas (${avail})</option>`;
    $('#opt-count').value = String(settings.count);

    const typeCounts = {};
    pool().forEach((q) => { typeCounts[q.type] = (typeCounts[q.type] || 0) + 1; });
    $('#types-line').textContent = Object.keys(TYPES).filter((t) => typeCounts[t]).map((t) => `${typeCounts[t]} ${TYPE_PLURAL[t]}`).join(' · ');

    const n = settings.count === 'all' ? avail : Math.min(settings.count, avail);
    $('#selection-summary').textContent = avail ? `${n} ${n === 1 ? 'pregunta' : 'preguntas'} · opciones mezcladas en cada intento` : 'Elegí al menos un tema';
    $('#btn-start').disabled = avail === 0;

    const failed = failedFromHistory();
    const rf = $('#btn-review-failed');
    rf.classList.toggle('hidden', !failed.length);
    rf.textContent = `Repasar falladas (${failed.length})`;

    const s = loadSession();
    $('#resume-panel').classList.toggle('hidden', !s);
    if (s) {
      const answered = s.ids.filter((id) => s.resp[id]).length;
      $('#resume-text').innerHTML = `${esc(s.label || 'Intento')}: vas por la pregunta <strong>${s.cur + 1}</strong> de <strong>${s.ids.length}</strong> (${answered} respondidas).`;
    }

    const hist = store.get(K('history'), []);
    $('#history-panel').classList.toggle('hidden', !hist.length);
    if (hist.length) {
      $('#history-table').innerHTML = '<tr><th>Fecha</th><th>Tipo</th><th class="num">Preguntas</th><th class="num">Puntaje</th></tr>' +
        hist.slice(0, 8).map((h) => `<tr><td>${esc(new Date(h.date).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }))}</td><td>${esc(h.label)}</td><td class="num">${h.n}</td><td class="num">${h.pct}%</td></tr>`).join('');
    }
  }

  $('#cat-chips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const c = chip.dataset.cat;
    settings.cats = settings.cats.includes(c) ? settings.cats.filter((x) => x !== c) : CATS.filter((x) => x === c || settings.cats.includes(x));
    saveSettings(); renderStart();
  });
  $('#cats-all').addEventListener('click', () => { settings.cats = CATS.slice(); saveSettings(); renderStart(); });
  $('#cats-none').addEventListener('click', () => { settings.cats = []; saveSettings(); renderStart(); });
  $('#opt-count').addEventListener('change', (e) => { settings.count = e.target.value === 'all' ? 'all' : +e.target.value; saveSettings(); renderStart(); });
  $('#opt-shuffle').addEventListener('change', (e) => { settings.shuffle = e.target.checked; saveSettings(); });
  $('#opt-open').addEventListener('change', (e) => { settings.open = e.target.checked; saveSettings(); renderStart(); });
  $('#btn-clear-history').addEventListener('click', () => {
    if (!confirm('¿Borrar el historial de intentos y el registro de preguntas falladas?')) return;
    store.del(K('history')); store.del(K('qstats')); renderStart();
  });

  // Selección proporcional por tema (resto mayor) cuando se piden menos preguntas que las disponibles.
  function pick(questions, count, shuffleOrder) {
    let chosen = questions;
    if (count !== 'all' && count < questions.length) {
      const groups = new Map();
      questions.forEach((q) => { if (!groups.has(q.cat)) groups.set(q.cat, []); groups.get(q.cat).push(q); });
      const quotas = [...groups.entries()].map(([cat, qs]) => {
        const exact = (count * qs.length) / questions.length;
        return { qs, take: Math.floor(exact), rem: exact - Math.floor(exact) };
      });
      let left = count - quotas.reduce((s, x) => s + x.take, 0);
      quotas.slice().sort((a, b) => b.rem - a.rem).forEach((x) => { if (left > 0) { x.take++; left--; } });
      chosen = quotas.flatMap((x) => shuffle(x.qs).slice(0, x.take));
    }
    return shuffleOrder ? shuffle(chosen) : chosen.slice().sort((a, b) => a.n - b.n);
  }

  function makePerm(q) {
    if (q.type === 'single' || q.type === 'multi') return q.fixedOrder ? range(q.options.length) : shuffle(range(q.options.length));
    if (q.type === 'match') return shuffle(range(q.pairs.length + (q.extra ? q.extra.length : 0)));
    if (q.type === 'order') {
      let p;
      do { p = shuffle(range(q.items.length)); } while (p.every((v, i) => v === i));
      return p;
    }
    return null;
  }

  function startSession(questions, label) {
    if (!questions.length) return;
    S = { ids: questions.map((q) => q.id), perms: {}, cur: 0, resp: {}, phase: 'answering', draft: '', started: Date.now(), label };
    questions.forEach((q) => { const p = makePerm(q); if (p) S.perms[q.id] = p; });
    saveSession();
    show('quiz');
    renderQuestion();
  }

  $('#btn-start').addEventListener('click', () => {
    if (loadSession() && !confirm('Hay un intento sin terminar. ¿Descartarlo y empezar uno nuevo?')) return;
    startSession(pick(pool(), settings.count, settings.shuffle), 'Práctica');
  });
  $('#btn-review-failed').addEventListener('click', () => {
    if (loadSession() && !confirm('Hay un intento sin terminar. ¿Descartarlo y empezar el repaso?')) return;
    const ids = failedFromHistory();
    startSession(pick(BANK.filter((q) => ids.includes(q.id)), 'all', settings.shuffle), 'Repaso de falladas');
  });
  $('#btn-resume').addEventListener('click', () => {
    S = loadSession();
    if (!S) { renderStart(); return; }
    show('quiz');
    renderQuestion();
  });
  $('#btn-discard').addEventListener('click', () => { clearSession(); renderStart(); });

  // ───────── pregunta ─────────
  const matchRights = (q) => q.pairs.map((p) => p[1]).concat(q.extra || []);

  function optionHTML(text, value, k, kind) {
    return `<button type="button" class="option" role="${kind === 'multi' ? 'checkbox' : 'radio'}" aria-checked="false" data-v="${value}">` +
      `<span class="option-marker ${kind === 'multi' ? 'marker-check' : 'marker-radio'}">${k < 9 ? k + 1 : ''}</span>` +
      `<span class="option-text">${text}</span></button>`;
  }

  function orderItemHTML(text, orig) {
    return `<li class="order-item" data-v="${orig}"><span class="order-pos"></span><span class="order-text">${text}</span>` +
      `<span class="order-btns"><button type="button" class="order-btn" data-dir="-1" aria-label="Subir">▲</button>` +
      `<button type="button" class="order-btn" data-dir="1" aria-label="Bajar">▼</button></span></li>`;
  }

  function renumberOrder() {
    const items = $$('.order-item', card);
    items.forEach((li, i) => {
      $('.order-pos', li).textContent = i + 1;
      const [up, down] = $$('.order-btn', li);
      up.disabled = i === 0 || S.phase !== 'answering';
      down.disabled = i === items.length - 1 || S.phase !== 'answering';
    });
  }

  function renderQuestion() {
    const q = curQ();
    const total = S.ids.length;
    const r = S.resp[q.id];
    const perm = S.perms[q.id];
    $('#q-current').textContent = S.cur + 1;
    $('#q-total').textContent = total;
    $('#q-category').textContent = q.cat;
    $('#progress-fill').style.width = `${(S.ids.filter((id) => S.resp[id]).length / total) * 100}%`;

    let h = `<div class="question-meta">Pregunta ${S.cur + 1}<span class="question-tag">${esc(q.cat)}</span><span class="question-tag">${TYPES[q.type]}</span></div>`;
    h += `<div class="question-text">${q.text}</div>`;
    if (q.code) h += `<pre class="snippet">${esc(q.code)}</pre>`;

    switch (q.type) {
      case 'single':
      case 'multi':
        if (q.type === 'multi') h += '<p class="hint">Marcá <strong>todas</strong> las correctas.</p>';
        h += `<div class="options" role="${q.type === 'multi' ? 'group' : 'radiogroup'}">` +
          perm.map((orig, k) => optionHTML(q.options[orig], orig, k, q.type)).join('') + '</div>';
        break;
      case 'tf':
        h += `<div class="options" role="radiogroup">${optionHTML('Verdadero', 'true', 0, 'single')}${optionHTML('Falso', 'false', 1, 'single')}</div>`;
        break;
      case 'text':
        h += '<input type="text" class="text-input" id="text-answer" placeholder="Tu respuesta…" autocomplete="off" spellcheck="false">';
        break;
      case 'match': {
        const rights = matchRights(q);
        h += `<p class="hint">Elegí la opción que corresponde a cada elemento${q.extra && q.extra.length ? ' · <strong>sobran opciones</strong>' : ''}.</p><div class="match">`;
        q.pairs.forEach((p, li) => {
          h += `<div class="match-row" data-i="${li}"><div class="match-left">${p[0]}</div>` +
            `<select class="match-select" aria-label="Opción para ${esc(plain(p[0]))}"><option value="">Elegí…</option>` +
            perm.map((ri) => `<option value="${ri}">${esc(plain(rights[ri]))}</option>`).join('') +
            '</select><div class="match-fb"></div></div>';
        });
        h += '</div>';
        break;
      }
      case 'order': {
        const seq = r ? r.ua : perm;
        h += '<p class="hint">Ordená con las flechas, del <strong>primero</strong> al <strong>último</strong>.</p>' +
          '<ol class="order">' + seq.map((orig) => orderItemHTML(q.items[orig], orig)).join('') + '</ol>';
        break;
      }
      case 'open':
        h += '<textarea class="text-area" id="open-answer" placeholder="Escribí tu respuesta (opcional) y después compará con la respuesta modelo…"></textarea>';
        break;
    }
    h += '<div id="feedback-area" aria-live="polite"></div>';
    card.innerHTML = h;
    if (q.type === 'order') renumberOrder();

    if (r) {
      S.phase = 'feedback';
      applyFeedback(q, r);
    } else if (S.phase === 'grading' && q.type === 'open') {
      $('#open-answer').value = S.draft || '';
      showGrading(q);
    } else {
      S.phase = 'answering';
      if (q.type === 'text') $('#text-answer').focus();
    }
    updateControls();
  }

  card.addEventListener('click', (e) => {
    const opt = e.target.closest('.option');
    if (opt) { toggleOption(opt); return; }
    const ob = e.target.closest('.order-btn');
    if (ob && S.phase === 'answering') {
      const li = ob.closest('.order-item');
      if (+ob.dataset.dir < 0 && li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling);
      if (+ob.dataset.dir > 0 && li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li);
      renumberOrder();
      if (!ob.disabled) ob.focus(); else $('.order-btn:not(:disabled)', li)?.focus();
      return;
    }
    const g = e.target.closest('.btn-grade');
    if (g) gradeOpen(g.dataset.g);
  });

  function toggleOption(el) {
    if (S.phase !== 'answering' || el.disabled) return;
    const q = curQ();
    if (q.type === 'multi') {
      const on = el.getAttribute('aria-checked') !== 'true';
      el.setAttribute('aria-checked', String(on));
      el.classList.toggle('selected', on);
    } else {
      $$('.option', card).forEach((o) => { o.classList.remove('selected'); o.setAttribute('aria-checked', 'false'); });
      el.classList.add('selected');
      el.setAttribute('aria-checked', 'true');
    }
  }

  function collect(q) {
    switch (q.type) {
      case 'single': { const s = $('.option.selected', card); return s ? +s.dataset.v : null; }
      case 'tf': { const s = $('.option.selected', card); return s ? s.dataset.v === 'true' : null; }
      case 'multi': { const v = $$('.option.selected', card).map((o) => +o.dataset.v).sort((a, b) => a - b); return v.length ? v : null; }
      case 'text': { const v = $('#text-answer').value.trim(); return v || null; }
      case 'match': { const v = $$('.match-select', card).map((s) => (s.value === '' ? null : +s.value)); return v.every((x) => x !== null) ? v : null; }
      case 'order': return $$('.order-item', card).map((li) => +li.dataset.v);
      case 'open': return $('#open-answer').value;
    }
    return null;
  }

  // Normaliza para comparar respuestas cortas: sin tildes, mayúsculas, signos ni artículo inicial.
  function normText(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim()
      .replace(/^(el|la|los|las|un|una|unos|unas|lo|the)\s+/, '')
      .replace(/\s+/g, '');
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    const prev = range(b.length + 1);
    for (let i = 1; i <= a.length; i++) {
      let diag = prev[0];
      prev[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const tmp = prev[j];
        prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
        diag = tmp;
      }
    }
    return prev[b.length];
  }

  function matchText(ua, q) {
    const u = normText(ua);
    let best = null;
    for (const a of q.answers) {
      const n = normText(a);
      if (u === n) return { ok: true, fuzzy: false, matched: a };
      if (q.exact) continue;
      const tol = n.length <= 4 ? 0 : n.length <= 8 ? 1 : 2;
      const d = levenshtein(u, n);
      if (d <= tol && (!best || d < best.d)) best = { d, a };
    }
    return best ? { ok: true, fuzzy: true, matched: best.a } : { ok: false };
  }

  function grade(q, ua) {
    let ok = false;
    const info = {};
    switch (q.type) {
      case 'single':
      case 'tf':
        ok = ua === q.answer;
        break;
      case 'multi': {
        const c = q.answer.slice().sort((a, b) => a - b);
        ok = ua.length === c.length && ua.every((v, i) => v === c[i]);
        info.hits = ua.filter((v) => q.answer.includes(v)).length;
        info.extra = ua.length - info.hits;
        break;
      }
      case 'text': Object.assign(info, matchText(ua, q)); ok = info.ok; break;
      case 'match':
      case 'order':
        info.hits = ua.filter((v, i) => v === i).length;
        ok = info.hits === ua.length;
        break;
    }
    return { status: ok ? 'correct' : 'wrong', score: ok ? 1 : 0, ua, info };
  }

  function nudge(msg) {
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    if (msg) $('#feedback-area').innerHTML = `<p class="hint" style="margin: 1rem 0 0;">${msg}</p>`;
  }

  function onAction() {
    if (!S || screen !== 'quiz') return;
    const q = curQ();
    if (S.phase === 'answering') {
      const ua = collect(q);
      if (q.type === 'open') {
        S.draft = ua;
        S.phase = 'grading';
        saveSession();
        showGrading(q);
        updateControls();
        return;
      }
      if (ua === null) {
        nudge(q.type === 'match' ? 'Completá <strong>todos</strong> los pares antes de verificar.' : '');
        return;
      }
      const r = grade(q, ua);
      commit(q, r);
      applyFeedback(q, r);
      updateControls();
    } else if (S.phase === 'feedback') {
      next();
    }
  }

  function commit(q, r) {
    S.resp[q.id] = r;
    S.phase = 'feedback';
    recordStats(q, r);
    saveSession();
    $('#progress-fill').style.width = `${(S.ids.filter((id) => S.resp[id]).length / S.ids.length) * 100}%`;
  }

  function next() {
    if (S.cur < S.ids.length - 1) {
      S.cur++;
      S.phase = 'answering';
      S.draft = '';
      saveSession();
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      finish();
    }
  }

  function skip() {
    if (!S || S.phase !== 'answering') return;
    const q = curQ();
    const r = { status: 'skipped', score: 0, ua: null, info: {} };
    S.resp[q.id] = r;
    recordStats(q, r);
    next();
  }

  function updateControls() {
    const q = curQ();
    const act = $('#btn-action');
    const isLast = S.cur === S.ids.length - 1;
    act.disabled = S.phase === 'grading';
    if (S.phase === 'answering') act.textContent = q.type === 'open' ? 'Ver respuesta modelo' : 'Verificar';
    else if (S.phase === 'grading') act.textContent = 'Elegí cómo te fue ↑';
    else act.textContent = isLast ? 'Ver resultados →' : 'Siguiente →';
    $('#btn-skip').disabled = S.phase !== 'answering';
  }

  // ───────── desarrollo: respuesta modelo y autoevaluación ─────────
  function modelHTML(q) {
    return '<div class="model"><div class="model-label">Respuesta modelo</div>' +
      `<div class="model-text">${q.answer}</div>` +
      (q.points && q.points.length ? `<div class="model-label">Puntos clave que no pueden faltar</div><ul class="model-points">${q.points.map((p) => `<li>${p}</li>`).join('')}</ul>` : '') +
      '</div>';
  }

  function showGrading(q) {
    $('#open-answer').readOnly = true;
    $('#feedback-area').innerHTML = `<div class="feedback">${modelHTML(q)}` +
      (q.explain ? `<div class="fb-explain">${q.explain}</div>` : '') +
      '<div class="grade-row"><span>¿Cómo te fue?</span>' +
      '<button type="button" class="btn-grade" data-g="correct">1 · Lo sabía</button>' +
      '<button type="button" class="btn-grade" data-g="partial">2 · A medias</button>' +
      '<button type="button" class="btn-grade" data-g="wrong">3 · No lo sabía</button></div></div>';
  }

  function gradeOpen(g) {
    if (!S || S.phase !== 'grading') return;
    const q = curQ();
    const r = { status: g, score: g === 'correct' ? 1 : g === 'partial' ? 0.5 : 0, ua: S.draft || '', info: {} };
    commit(q, r);
    applyFeedback(q, r);
    updateControls();
    $('#btn-action').focus();
  }

  // ───────── corrección visual ─────────
  function mark(el, cls, sym) {
    el.classList.add(cls);
    const m = $('.option-marker', el);
    if (m) m.textContent = sym;
  }

  function applyFeedback(q, r) {
    const ua = r.ua;
    switch (q.type) {
      case 'single':
      case 'tf': {
        const correctV = String(q.answer);
        $$('.option', card).forEach((el) => {
          el.disabled = true;
          el.classList.remove('selected');
          const v = el.dataset.v;
          if (v === correctV) mark(el, 'correct', '✓');
          else if (ua !== null && v === String(ua)) mark(el, 'wrong', '✗');
        });
        break;
      }
      case 'multi': {
        const user = new Set(ua || []);
        $$('.option', card).forEach((el) => {
          el.disabled = true;
          el.classList.remove('selected');
          const v = +el.dataset.v;
          const inC = q.answer.includes(v);
          if (inC && user.has(v)) mark(el, 'correct', '✓');
          else if (!inC && user.has(v)) mark(el, 'wrong', '✗');
          else if (inC) mark(el, 'missed', '·');
        });
        break;
      }
      case 'text': {
        const inp = $('#text-answer');
        inp.value = ua ?? '';
        inp.disabled = true;
        inp.classList.add(r.status === 'correct' ? 'correct' : 'wrong');
        break;
      }
      case 'match': {
        const rights = matchRights(q);
        $$('.match-row', card).forEach((row, i) => {
          const sel = $('.match-select', row);
          sel.value = String(ua[i]);
          sel.disabled = true;
          const ok = ua[i] === i;
          row.classList.add(ok ? 'correct' : 'wrong');
          if (!ok) $('.match-fb', row).innerHTML = `✓ Correcta: ${esc(plain(rights[i]))}`;
        });
        break;
      }
      case 'order':
        $$('.order-item', card).forEach((li, i) => {
          const ok = +li.dataset.v === i;
          li.classList.add(ok ? 'correct' : 'wrong');
          const btns = $('.order-btns', li);
          btns.innerHTML = ok ? '' : `<span class="order-note">va en ${+li.dataset.v + 1}.º</span>`;
        });
        break;
      case 'open': {
        const ta = $('#open-answer');
        ta.value = ua || '';
        ta.readOnly = true;
        break;
      }
    }
    $('#feedback-area').innerHTML = feedbackHTML(q, r);
  }

  function feedbackHTML(q, r) {
    const labels = { correct: '✓ Correcto', wrong: '✗ Incorrecto', partial: '½ A medias' };
    if (q.type === 'open') labels.correct = '✓ Lo sabías';
    if (q.type === 'open') labels.wrong = '✗ A repasar';
    let extra = '';
    const i = r.info || {};
    if (q.type === 'text') {
      if (r.status === 'correct' && i.fuzzy) extra = `Aceptada con tolerancia a errores de tipeo. Forma esperada: <strong>${esc(i.matched)}</strong>.`;
      else if (r.status !== 'correct') extra = `Respuesta esperada: <strong>${esc(q.answers[0])}</strong>.`;
    } else if (q.type === 'multi' && r.status !== 'correct') {
      extra = `Marcaste ${i.hits} de ${q.answer.length} correctas` + (i.extra ? ` y ${i.extra} incorrecta${i.extra > 1 ? 's' : ''}.` : '.');
    } else if (q.type === 'match' && r.status !== 'correct') {
      extra = `${i.hits} de ${q.pairs.length} pares correctos.`;
    } else if (q.type === 'order' && r.status !== 'correct') {
      extra = `${i.hits} de ${q.items.length} en su lugar. Orden correcto:<ol>${q.items.map((t) => `<li>${t}</li>`).join('')}</ol>`;
    } else if (q.type === 'open') {
      extra = modelHTML(q);
    }
    return `<div class="feedback ${r.status}"><span class="feedback-label">${labels[r.status]}</span>` +
      (extra ? `<div class="fb-extra">${extra}</div>` : '') +
      (q.explain ? `<div class="fb-explain">${q.explain}</div>` : '') + '</div>';
  }

  // ───────── resultados ─────────
  function finish() {
    const ids = S.ids.filter((id) => S.resp[id]);
    const hist = store.get(K('history'), []);
    clearSession();
    if (!ids.length) { S = null; renderStart(); show('start'); return; }
    LAST = { ids, resp: S.resp, total: S.ids.length, label: S.label };
    const pts = ids.reduce((s, id) => s + S.resp[id].score, 0);
    hist.unshift({ date: Date.now(), label: S.label, n: ids.length, pct: Math.round((pts / ids.length) * 100) });
    store.set(K('history'), hist.slice(0, 30));
    S = null;
    renderResults();
    show('results');
  }

  $('#btn-finish').addEventListener('click', () => {
    const answered = S.ids.filter((id) => S.resp[id]).length;
    const msg = answered
      ? `¿Terminar ahora? El resultado se calcula con las ${answered} preguntas respondidas.`
      : '¿Salir del intento? No respondiste ninguna pregunta todavía.';
    if (confirm(msg)) finish();
  });

  function renderResults() {
    const { ids, resp } = LAST;
    const count = (st) => ids.filter((id) => resp[id].status === st).length;
    const c = { correct: count('correct'), partial: count('partial'), wrong: count('wrong'), skipped: count('skipped') };
    const pts = ids.reduce((s, id) => s + resp[id].score, 0);
    const pct = Math.round((pts / ids.length) * 100);

    $('#results-eyebrow').textContent = LAST.label === 'Repaso de falladas' ? 'Resultado del repaso' : 'Resultado final';
    $('#results-score').textContent = pct + '%';
    $('#results-fraction').textContent = (c.partial ? `${fmtNum(pts)} de ${ids.length} puntos` : `${c.correct} de ${ids.length} correctas`) +
      (ids.length < LAST.total ? ` · terminado en la ${ids.length}.ª de ${LAST.total}` : '');

    let msg;
    if (pct >= 90) msg = 'Dominio sólido del material. Muy buen nivel para la evaluación.';
    else if (pct >= 75) msg = 'Buen manejo general. Revisá las que fallaste para no llegar con huecos.';
    else if (pct >= 60) msg = 'Tenés las ideas centrales, pero hay temas que merecen otra pasada.';
    else if (pct >= 40) msg = 'Hay conceptos importantes para reforzar. Repasá el material y volvé a intentar.';
    else msg = 'Conviene volver al material teórico antes de seguir practicando.';
    $('#results-message').textContent = msg;

    $('#results-stats').innerHTML =
      `<div class="stat good"><div class="stat-num">${c.correct}</div><div class="stat-label">Correctas</div></div>` +
      (c.partial ? `<div class="stat mid"><div class="stat-num">${c.partial}</div><div class="stat-label">A medias</div></div>` : '') +
      `<div class="stat bad"><div class="stat-num">${c.wrong}</div><div class="stat-label">Incorrectas</div></div>` +
      `<div class="stat"><div class="stat-num">${c.skipped}</div><div class="stat-label">Saltadas</div></div>`;

    $('#cat-results').innerHTML = CATS.map((cat) => {
      const cids = ids.filter((id) => BY_ID.get(id).cat === cat);
      if (!cids.length) return '';
      const cp = cids.reduce((s, id) => s + resp[id].score, 0);
      const p = Math.round((cp / cids.length) * 100);
      const color = p >= 75 ? 'var(--correct)' : p >= 50 ? 'var(--partial)' : 'var(--wrong)';
      return `<div class="cat-row"><div class="cat-row-top"><span>${esc(cat)}</span><span class="cat-row-score"><strong>${fmtNum(cp)}/${cids.length}</strong> · ${p}%</span></div>` +
        `<div class="cat-bar"><div style="width: ${p}%; background: ${color};"></div></div></div>`;
    }).join('');

    const failed = ids.filter((id) => resp[id].status !== 'correct');
    const rb = $('#btn-retry-failed');
    rb.classList.toggle('hidden', !failed.length);
    rb.textContent = `Repasar falladas (${failed.length})`;

    reviewFilter = 'all';
    $('#review-section').classList.add('hidden');
  }

  function uaString(q, r) {
    if (r.status === 'skipped') return '—';
    switch (q.type) {
      case 'single': return q.options[r.ua];
      case 'tf': return r.ua ? 'Verdadero' : 'Falso';
      case 'multi': return r.ua.map((i) => q.options[i]).join(' · ');
      case 'text': return esc(r.ua);
      case 'match': { const rights = matchRights(q); return q.pairs.map((p, i) => `${p[0]} → ${rights[r.ua[i]]}`).join('<br>'); }
      case 'order': return r.ua.map((v, i) => `${i + 1}. ${q.items[v]}`).join('<br>');
      case 'open': return r.ua && r.ua.trim() ? esc(r.ua).replace(/\n/g, '<br>') : '<em>(sin escribir)</em>';
    }
    return '';
  }

  function correctString(q) {
    switch (q.type) {
      case 'single': return q.options[q.answer];
      case 'tf': return q.answer ? 'Verdadero' : 'Falso';
      case 'multi': return q.answer.map((i) => q.options[i]).join(' · ');
      case 'text': return esc(q.answers[0]);
      case 'match': return q.pairs.map((p) => `${p[0]} → ${p[1]}`).join('<br>');
      case 'order': return q.items.map((t, i) => `${i + 1}. ${t}`).join('<br>');
      case 'open': return modelHTML(q);
    }
    return '';
  }

  // En emparejar, ordenar y desarrollo la respuesta ocupa varias líneas: va en un bloque aparte.
  function reviewLine(label, html, q) {
    const block = ['match', 'order', 'open'].includes(q.type) && html !== '—';
    return `<div class="review-line"><em>${label}:</em>${block ? `<div class="review-block">${html}</div>` : ` ${html}`}</div>`;
  }

  function renderReview() {
    const { ids, resp } = LAST;
    const names = { correct: 'Correcta', wrong: 'Incorrecta', partial: 'A medias', skipped: 'Saltada' };
    const list = ids.map((id, i) => ({ q: BY_ID.get(id), r: resp[id], i }))
      .filter((x) => reviewFilter === 'all' || x.r.status !== 'correct');
    $('#review-list').innerHTML = list.length ? list.map(({ q, r, i }) =>
      `<div class="review-item ${r.status}">` +
        `<div class="review-meta"><span class="st-${r.status}">${names[r.status]}</span> · ${esc(q.cat)} · ${TYPES[q.type]} · Pregunta ${i + 1}</div>` +
        `<div class="review-q">${q.text}</div>` +
        (q.code ? `<pre class="snippet">${esc(q.code)}</pre>` : '') +
        reviewLine('Tu respuesta', uaString(q, r), q) +
        (q.type === 'open'
          ? `<div class="review-line">${correctString(q)}</div>`
          : reviewLine('Correcta', correctString(q), q)) +
        (q.explain ? `<div class="review-explain">${q.explain}</div>` : '') +
      '</div>').join('') : '<p class="start-info">No hay preguntas falladas en este intento. 🎯</p>';
  }

  $('#btn-review').addEventListener('click', () => {
    const sec = $('#review-section');
    sec.classList.toggle('hidden');
    if (!sec.classList.contains('hidden')) { renderReview(); sec.scrollIntoView({ behavior: 'smooth' }); }
  });
  $$('#review-section [data-filter]').forEach((b) => b.addEventListener('click', () => {
    reviewFilter = b.dataset.filter;
    $$('#review-section [data-filter]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderReview();
  }));
  $('#btn-retry-failed').addEventListener('click', () => {
    const failed = LAST.ids.filter((id) => LAST.resp[id].status !== 'correct');
    startSession(pick(failed.map((id) => BY_ID.get(id)), 'all', settings.shuffle), 'Repaso de falladas');
  });
  $('#btn-home').addEventListener('click', () => { renderStart(); show('start'); });

  // ───────── botones y teclado ─────────
  $('#btn-action').addEventListener('click', onAction);
  $('#btn-skip').addEventListener('click', skip);

  document.addEventListener('keydown', (e) => {
    if (screen !== 'quiz' || !S || e.altKey || e.metaKey) return;
    const t = e.target;
    const tag = t.tagName;
    if (tag === 'TEXTAREA') {
      if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); onAction(); }
      return;
    }
    if (tag === 'INPUT') {
      if (e.key === 'Enter') { e.preventDefault(); onAction(); }
      return;
    }
    if (tag === 'SELECT' || e.ctrlKey) return;
    if (e.key === 'Enter') {
      if (tag === 'BUTTON' && !t.classList.contains('option') && t.id !== 'btn-action') return; // que el botón haga lo suyo
      e.preventDefault();
      onAction();
      return;
    }
    const q = curQ();
    if (/^[1-9]$/.test(e.key)) {
      const k = +e.key - 1;
      if (S.phase === 'answering' && ['single', 'multi', 'tf'].includes(q.type)) {
        const opts = $$('.option', card);
        if (opts[k]) { e.preventDefault(); toggleOption(opts[k]); }
      } else if (S.phase === 'grading' && k < 3) {
        e.preventDefault();
        gradeOpen(['correct', 'partial', 'wrong'][k]);
      }
      return;
    }
    if ((e.key === 's' || e.key === 'S') && S.phase === 'answering') { e.preventDefault(); skip(); }
  });

  renderStart();
})();
</script>
</body>
</html>
